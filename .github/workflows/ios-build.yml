name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Debug Configuration
        run: |
          {
            echo '#include "Base.xcconfig"'
            echo ''
            echo 'DEVELOPMENT_TEAM = '
            echo 'BUNDLE_ID_PREFIX = com.ci'
            echo 'BUNDLE_ID_SUFFIX = shelfplayer'
            echo ''
            echo 'ENTITLEMENT_BASE = FREE_DEVELOPER_ACCOUNT'
            echo 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG'
          } > Configuration/Debug.xcconfig

      - name: Build
        run: |
          xcodebuild build \
            -project ShelfPlayer.xcodeproj \
            -scheme Multiplatform \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  publish:
    name: Publish to TestFlight
    runs-on: macos-15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install Provisioning Profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGETS }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          echo "$PROFILE_APP_BASE64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_WIDGETS_BASE64" | base64 -d > "$RUNNER_TEMP/widgets.mobileprovision"

          APP_UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          WIDGETS_UUID=$(security cms -D -i "$RUNNER_TEMP/widgets.mobileprovision" | plutil -extract UUID raw -)

          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFILES_DIR/$APP_UUID.mobileprovision"
          cp "$RUNNER_TEMP/widgets.mobileprovision" "$PROFILES_DIR/$WIDGETS_UUID.mobileprovision"

          echo "APP_PROFILE_UUID=$APP_UUID" >> "$GITHUB_ENV"
          echo "WIDGETS_PROFILE_UUID=$WIDGETS_UUID" >> "$GITHUB_ENV"

      - name: Create Release Configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'N8AA4S3S96' }}
          BUNDLE_ID_PREFIX: ${{ secrets.APPLE_BUNDLE_ID_PREFIX || 'io.rfk' }}
          KEYCHAIN_GROUP: ${{ secrets.KEYCHAIN_GROUP_SUFFIX || 'ShelfPlayer' }}
        run: |
          {
            echo '#include "Base.xcconfig"'
            echo ''
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            echo "BUNDLE_ID_PREFIX = $BUNDLE_ID_PREFIX"
            echo 'BUNDLE_ID_SUFFIX = shelfplayer'
            echo ''
            echo "KEYCHAIN_GROUP_SUFFIX = $KEYCHAIN_GROUP"
            echo 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = ENABLE_CENTRALIZED'
          } > Configuration/Release.xcconfig

      - name: Install App Store Connect API Key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_API_KEY_BASE64" | base64 -d > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Create Export Options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'N8AA4S3S96' }}
          BUNDLE_ID_PREFIX: ${{ secrets.APPLE_BUNDLE_ID_PREFIX || 'io.rfk' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID_PREFIX.shelfplayer</key>
                  <string>$APP_PROFILE_UUID</string>
                  <key>$BUNDLE_ID_PREFIX.shelfplayer.Widgets</key>
                  <string>$WIDGETS_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          xcodebuild archive \
            -project ShelfPlayer.xcodeproj \
            -scheme Multiplatform \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ShelfPlayer.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ShelfPlayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/ShelfPlayer.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
